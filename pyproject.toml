[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eks-sre-agent"
version = "1.0.0"
description = "Claude/Bedrock-powered SRE agent for EKS incident analysis, Slack alerting, and GitHub auto-fix PRs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["aws", "eks", "sre", "claude", "bedrock", "ai", "agent", "slack", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "anthropic>=0.40.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
bedrock = []  # boto3 already includes Bedrock; this group is a marker for clarity
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "moto[dynamodb,cloudwatch,logs,lambda]>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,cloudwatch,logs,lambda,eks]>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sre_agent*"]

# ---------------------------------------------------------------------------
# Ruff — linting + import sorting + code quality
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ANN", # flake8-annotations (type hints)
    "RUF", # ruff-specific rules
    "PTH", # use pathlib over os.path where possible
    "TRY", # tryceratops — clean exception handling
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "S101",    # assert usage is fine in tests
    "S110",    # try/except/pass
    "S310",    # Audit URL open for permitted schemes
    "TRY003",  # Long messages in raises — acceptable for clarity
    "TRY300",  # try/except/else — personal preference
    "TRY400",  # Use logging.exception instead of logging.error
    "TRY401",  # Redundant exception object included in logging.exception call
    "S108",    # Probable insecure temp file — only in tests
    "E501",    # Line too long
    "G201",    # Logging .exception(...) should be used instead of .error(..., exc_info=True)
    "RUF100",  # Unused noqa directive
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "N", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["sre_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=sre_agent",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=90",
    "--cov-branch",
    "-v",
    "--tb=short",
]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/sre_agent"]
branch = true
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
