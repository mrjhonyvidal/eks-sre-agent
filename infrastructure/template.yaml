AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EKS AI Ops Toolkit — proactive monitoring + interactive Slack orchestrator

# ------------------------------------------------------------------ #
# Parameters                                                          #
# ------------------------------------------------------------------ #
Parameters:
  ClusterName:
    Type: String
    Description: EKS cluster name to monitor

  SlackChannel:
    Type: String
    Default: "#sre-alerts"

  GitHubRepo:
    Type: String
    Description: "org/repo to raise PRs against, e.g. myorg/k8s-infra"

  GitHubBaseBranch:
    Type: String
    Default: main

  EksMcpServer:
    Type: String
    Default: eks
    Description: MCP server identifier used by the interactive specialist

  McpGatewayUrl:
    Type: String
    Default: ""
    Description: Optional MCP gateway URL for interactive EKS tools

  IntentUseLlm:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable Bedrock-based intent classification for orchestrator

  IntentModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
    Description: Bedrock model ID used for interactive intent classification

  # Sensitive values — store in SSM Parameter Store / Secrets Manager
  AnthropicApiKeyParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /eks-ai-ops-toolkit/anthropic-api-key

  SlackBotTokenParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /eks-ai-ops-toolkit/slack-bot-token

  SlackSigningSecretParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /eks-ai-ops-toolkit/slack-signing-secret

  GitHubTokenParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /eks-ai-ops-toolkit/github-token

# ------------------------------------------------------------------ #
# Globals                                                             #
# ------------------------------------------------------------------ #
Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        CLUSTER_NAME: !Ref ClusterName
        SLACK_CHANNEL: !Ref SlackChannel
        GITHUB_REPO: !Ref GitHubRepo
        GITHUB_BASE_BRANCH: !Ref GitHubBaseBranch
        INCIDENT_TABLE: !Ref IncidentTable
        DEPLOY_TABLE: !Ref DeployTable
        ANTHROPIC_API_KEY: !Ref AnthropicApiKeyParam
        SLACK_BOT_TOKEN: !Ref SlackBotTokenParam
        SLACK_SIGNING_SECRET: !Ref SlackSigningSecretParam
        GITHUB_TOKEN: !Ref GitHubTokenParam
        KUBECTL_LAMBDA: !Ref KubectlHelperFunction
        EKS_MCP_SERVER: !Ref EksMcpServer
        MCP_GATEWAY_URL: !Ref McpGatewayUrl
        INTENT_USE_LLM: !Ref IntentUseLlm
        INTENT_MODEL_ID: !Ref IntentModelId

# ------------------------------------------------------------------ #
# Resources                                                           #
# ------------------------------------------------------------------ #
Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────
  IncidentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: sre-incidents
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD_INFREQUENT_ACCESS
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: slack_ts_index
          KeySchema:
            - AttributeName: slack_ts
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 0   # on-demand
            WriteCapacityUnits: 0
      # Note: add slack_ts to AttributeDefinitions if you add the GSI above
      # (shown here for reference — enable when needed)

  DeployTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: sre-deployments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service_name
          AttributeType: S
        - AttributeName: deployed_at
          AttributeType: S
      KeySchema:
        - AttributeName: service_name
          KeyType: HASH
        - AttributeName: deployed_at
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Lambda — SRE Agent (EventBridge-triggered) ───────────────────
  SREAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eks-ai-ops-toolkit
      CodeUri: src/eks_ai_ops/
      Handler: handler.handler
      Description: Analyses EKS/CloudWatch incidents using Claude
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeployTable
        - CloudWatchReadOnlyAccess
        - AmazonEKSDescribePolicy: {}   # see inline below
        - Statement:
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
                - logs:GetLogEvents
                - logs:DescribeLogGroups
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/containerinsights/*"
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt KubectlHelperFunction.Arn
      Events:
        CloudWatchAlarmChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.cloudwatch"]
              detail-type: ["CloudWatch Alarm State Change"]
              detail:
                state:
                  value: ["ALARM"]
        EKSAuditErrors:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.eks"]
              detail-type: ["AWS API Call via CloudTrail"]
              detail:
                errorCode:
                  - exists: true

  # ── Lambda — Slack Bot (API Gateway-triggered) ───────────────────
  SlackBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sre-slack-bot
      CodeUri: src/eks_ai_ops/
      Handler: bot_handler.handler
      Description: Interactive SRE chat bot via Slack Events API
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
      Events:
        SlackEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref SlackBotApi
            Path: /slack/events
            Method: POST

  SlackBotApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: Receives Slack Events API callbacks

  # ── Lambda — kubectl helper (runs in VPC alongside EKS) ──────────
  KubectlHelperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sre-kubectl-helper
      CodeUri: kubectl_helper/
      Handler: handler.handler
      Description: Runs kubectl commands inside the EKS VPC
      Timeout: 30
      # VPC config — fill in your EKS VPC details
      VpcConfig:
        SecurityGroupIds:
          - !Ref KubectlSecurityGroup
        SubnetIds:
          - !Sub "{{resolve:ssm:/eks-ai-ops-toolkit/eks-private-subnet-1}}"
          - !Sub "{{resolve:ssm:/eks-ai-ops-toolkit/eks-private-subnet-2}}"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - eks:DescribeCluster
                - eks:AccessKubernetesApi
              Resource: !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"

  KubectlSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kubectl helper Lambda SG
      VpcId: !Sub "{{resolve:ssm:/eks-ai-ops-toolkit/eks-vpc-id}}"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # ── Scheduled health sweep ────────────────────────────────────────
  ScheduledSweep:
    Type: AWS::Events::Rule
    Properties:
      Description: Periodic EKS health sweep
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: SREAgentScheduled
          Arn: !GetAtt SREAgentFunction.Arn
          Input: !Sub |
            {
              "source": "sre.scheduled",
              "detail": {
                "cluster": "${ClusterName}",
                "check_name": "scheduled-health-sweep",
                "namespace": "default",
                "resource_type": "deployment",
                "resource_name": "all"
              }
            }

  SREAgentScheduledPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SREAgentFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledSweep.Arn

# ------------------------------------------------------------------ #
# Outputs                                                             #
# ------------------------------------------------------------------ #
Outputs:
  SlackBotEndpoint:
    Description: Paste this URL into your Slack app Event Subscriptions
    Value: !Sub "https://${SlackBotApi}.execute-api.${AWS::Region}.amazonaws.com/prod/slack/events"

  InteractiveOrchestrator:
    Description: Interactive orchestrator entrypoint in code
    Value: eks_ai_ops.interactive.orchestrator.K8sOrchestratorAgent

  IncidentTableName:
    Value: !Ref IncidentTable

  SREAgentFunctionArn:
    Value: !GetAtt SREAgentFunction.Arn
