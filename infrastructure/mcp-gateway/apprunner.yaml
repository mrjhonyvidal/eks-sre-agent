# App Runner config — used only when deploying from a source repo.
# Our scripts deploy from ECR, so this is informational/optional.
version: 1.0
runtime: docker
build:
  commands:
    pre-build: []
    build: []
run:
  runtime-version: latest
  command: uvicorn server:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: AWS_REGION
      value: us-east-1
    - name: LOG_LEVEL
      value: INFO
